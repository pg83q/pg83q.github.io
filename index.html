* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 300;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  min-height: 100vh;
  /* 上にカードとリンクバー、いちばん下に曲バー */
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    linear-gradient(var(--scrim), var(--scrim)),
    url("bg.jpg") center / cover no-repeat,
    var(--bg);
}

.stack {
  width: 100%; max-width: 680px; min-width: 0; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}

.glass {
  position: relative;
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  backdrop-filter: blur(12px) saturate(160%);
  border: 1px solid var(--glass-edge-soft);
  box-shadow:
    inset 1.5px 1.5px 0 -0.5px var(--glass-edge),
    inset -1px -1px 0 -0.5px var(--glass-edge-soft),
    0 20px 50px -16px var(--shadow);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
}
.glass > * { position: relative; }

.card {
  width: 100%; min-width: 0;
  display: flex; align-items: center; gap: 36px;
  padding: 40px 44px;
  background: var(--glass);
  border-radius: 44px;
}
.avatar {
  width: 144px; height: 144px; flex: none; border-radius: 50%; display: block;
  object-fit: cover; background: var(--glass-strong);
  box-shadow: 0 0 0 1px var(--glass-edge), 0 0 0 8px rgba(255, 255, 255, 0.1), 0 18px 34px -12px var(--shadow);
}
.about { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
h1 {
  margin: 0; font-weight: 700; letter-spacing: 0.03em;
  font-size: clamp(30px, 7.5vw, 46px); line-height: 1.2; overflow-wrap: anywhere;
  text-shadow:
    0 0 6px rgba(255, 255, 255, 0.95),
    0 0 18px rgba(159, 208, 255, 0.85),
    0 0 42px rgba(159, 208, 255, 0.6);
}
h1 span { display: inline-block; }
.glow { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 10px rgba(159, 208, 255, 0.8)); }

/* 雪(名前から出る雪と、背景に降る雪)はこのキャンバスに描く。カードより後ろ、背景画像より前に置く */
#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
/* 名前から出る雪だけは、カードより手前に出す */
#flake { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
.tagline { margin: 0; color: var(--muted); font-weight: 300; font-size: 18px; overflow-wrap: anywhere; }
.place {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  color: var(--muted); font-size: 14px;
}
.place img { width: 18px; height: 18px; flex: none; }

.dock {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  padding: 8px; border-radius: 999px; max-width: 100%;
  background: var(--glass-bar);
}
.chip {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 10px 24px 10px 16px; border-radius: 999px;
  color: var(--fg); text-decoration: none;
  background: var(--glass-strong);
  box-shadow: inset 1px 1px 0 -0.5px var(--glass-edge), 0 6px 16px -8px var(--shadow);
  transition: transform .2s ease, background .2s ease;
}
.chip:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.2); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.chip img { width: 28px; height: 28px; flex: none; }
.chip span { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.chip small { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.chip b { font-weight: 400; font-size: 15px; overflow-wrap: anywhere; }

/* 曲バー: ページのいちばん下 */
.player {
  width: 100%; max-width: 420px; margin-top: 28px;
  font-family: "PlayerFont", var(--font);
  display: flex; align-items: center; gap: 16px;
  padding: 16px 22px 16px 16px; border-radius: 32px;
  background: var(--glass-bar);
}
.play {
  width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--fg);
  background: var(--glass-strong);
  box-shadow: inset 1px 1px 0 -0.5px var(--glass-edge), 0 6px 16px -8px var(--shadow);
  transition: transform .2s ease, background .2s ease;
}
.play:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.2); }
.play:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.play img { width: 24px; height: 24px; }
.player-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.track-title { margin: 0; font-weight: 400; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vol-icon { width: 22px; height: 22px; flex: none; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

input[type="range"].bar {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 18px; margin: 0;
  background: transparent; cursor: pointer; --p: 0%;
}
.bar::-webkit-slider-runnable-track {
  height: 5px; border-radius: 999px;
  background: linear-gradient(to right, rgba(255, 255, 255, 0.9) var(--p), rgba(255, 255, 255, 0.2) var(--p));
}
.bar::-moz-range-track { height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); }
.bar::-moz-range-progress { height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.9); }
.bar::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -4.5px;
  border-radius: 50%; border: 0; background: #fff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 14px rgba(159, 208, 255, 0.7);
}
.bar::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; border: 0; background: #fff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 14px rgba(159, 208, 255, 0.7);
}
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  .chip { transition: none; }
  .chip:hover { transform: none; }
}
@media (max-width: 560px) {
  .card { flex-direction: column; text-align: center; gap: 24px; padding: 36px 24px; border-radius: 36px; }
  .about { align-items: center; }
  .avatar { width: 128px; height: 128px; }
  .dock { border-radius: 32px; }
}

<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="flake" aria-hidden="true"></canvas>

<script>
(function () {
  // 動きを減らす設定のときは雪を出さない
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var canvas = document.getElementById("snow");
  var ctx = canvas.getContext("2d");
  var front = document.getElementById("flake");   // 名前から出る雪はカードより手前に描く
  var fctx = front.getContext("2d");
  var nameEl = document.getElementById("name");
  var img = new Image();
  var dpr = 1, W = 0, H = 0;
  var falling = [], burst = [];
  var last = 0, spawnAcc = 0;

  var VANISH_DIST = 50;    // 名前の文字から、これだけ離れたら消える(px)
  var FADE_FROM = 36;      // ここから少しずつ薄くなる(px)
  var SPAWN_PER_SEC = 12;  // 名前から出る雪の数(1秒あたり)

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 回る向きと速さは1つずつ違うけど、回転の速さはずっと一定
  function spin() { return rand(0.8, 1.6) * (Math.random() < 0.5 ? -1 : 1); }

  function drawFlake(c, p) {
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.drawImage(img, -p.size / 2, -p.size / 2, p.size, p.size);
    c.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    front.width = canvas.width;
    front.height = canvas.height;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function newFall(initial) {
    return {
      x: rand(0, W),
      y: initial ? rand(0, H) : rand(-30, -10),
      vy: rand(45, 95),        // 等速で落ちる(1つずつ速さは違う)
      size: rand(5, 11),
      alpha: rand(0.5, 0.95),
      rot: rand(0, Math.PI * 2),
      vr: spin()
    };
  }

  function fillFalling() {
    var target = Math.max(30, Math.min(80, Math.round(W / 22)));
    while (falling.length < target) falling.push(newFall(true));
    if (falling.length > target) falling.length = target;
  }

  function spawnBurst() {
    var r = nameEl.getBoundingClientRect();
    if (!r.width) return;
    var a = rand(0, Math.PI * 2), sp = rand(35, 75);   // 等速で飛んでいく
    burst.push({
      x: rand(r.left, r.right),
      y: rand(r.top, r.bottom),
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      size: rand(4, 7),
      rot: rand(0, Math.PI * 2),
      vr: spin(),
      age: 0
    });
  }

  function frame(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
    last = t;
    ctx.clearRect(0, 0, W, H);
    fctx.clearRect(0, 0, W, H);

    var i, p;
    for (i = 0; i < falling.length; i++) {
      p = falling[i];
      p.y += p.vy * dt;
      if (p.y > H + 20) falling[i] = newFall(false);
      p.rot += p.vr * dt;
      ctx.globalAlpha = p.alpha;
      drawFlake(ctx, p);
    }

    spawnAcc += dt * SPAWN_PER_SEC;
    while (spawnAcc >= 1) { spawnBurst(); spawnAcc -= 1; }

    var nr = nameEl.getBoundingClientRect();
    for (i = burst.length - 1; i >= 0; i--) {
      p = burst[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      // 名前の文字の枠から、どれだけ離れたか
      var dx = Math.max(nr.left - p.x, 0, p.x - nr.right);
      var dy = Math.max(nr.top - p.y, 0, p.y - nr.bottom);
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist >= VANISH_DIST) { burst.splice(i, 1); continue; }
      fctx.globalAlpha = dist < FADE_FROM ? 1 : (VANISH_DIST - dist) / (VANISH_DIST - FADE_FROM);
      drawFlake(fctx, p);
    }
    ctx.globalAlpha = 1;
    fctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  img.onload = function () {
    resize(); fillFalling();
    window.addEventListener("resize", function () { resize(); fillFalling(); });
    requestAnimationFrame(frame);
  };
  img.src = "snow.png";
})();
</script>

<script>
(function () {
  var a = document.getElementById("bgm");
  var playBtn = document.getElementById("play");
  var icoPlay = document.getElementById("icoPlay");
  var icoPause = document.getElementById("icoPause");
  var seek = document.getElementById("seek");
  var vol = document.getElementById("vol");
  var time = document.getElementById("time");
  var hint = document.getElementById("hint");
  var dragging = false;

  function fmt(s) {
    if (!isFinite(s)) s = 0;
    s = Math.floor(s);
    var r = s % 60;
    return Math.floor(s / 60) + ":" + (r < 10 ? "0" : "") + r;
  }
  function fill(el) { el.style.setProperty("--p", (el.value / el.max * 100) + "%"); }
  function renderTime() { time.textContent = fmt(a.currentTime) + " / " + fmt(a.duration); }
  function renderSeek() {
    if (!dragging && a.duration) seek.value = Math.round(a.currentTime / a.duration * 1000);
    fill(seek);
  }
  function renderState() {
    var playing = !a.paused;
    icoPlay.hidden = playing;
    icoPause.hidden = !playing;
    playBtn.setAttribute("aria-label", playing ? "一時停止" : "再生");
    if (playing) hint.hidden = true;
  }

  a.volume = vol.value / 100;
  fill(vol); fill(seek);

  a.addEventListener("loadedmetadata", function () { renderTime(); renderSeek(); });
  a.addEventListener("timeupdate", function () { renderTime(); renderSeek(); });
  a.addEventListener("play", renderState);
  a.addEventListener("pause", renderState);
  a.addEventListener("ended", renderState);

  seek.addEventListener("pointerdown", function () { dragging = true; });
  document.addEventListener("pointerup", function () { dragging = false; });
  seek.addEventListener("input", function () {
    fill(seek);
    if (a.duration) { a.currentTime = seek.value / 1000 * a.duration; renderTime(); }
  });
  vol.addEventListener("input", function () { a.volume = vol.value / 100; fill(vol); });

  // ページを開いたら自動で再生したい。ただ、ブラウザは音つきの自動再生を止めることが多いので、
  // 止められたら、最初のタップかキー操作で再生を始める
  var events = ["click", "keydown", "touchend"];
  function disarm() {
    events.forEach(function (ev) { document.removeEventListener(ev, onGesture, true); });
  }
  function onGesture(e) {
    if (e.target && e.target.closest && e.target.closest(".player")) return;
    if (e.type === "keydown" && (e.key === "Tab" || e.key === "Shift")) return;
    a.play().then(disarm).catch(function () {});
  }
  events.forEach(function (ev) { document.addEventListener(ev, onGesture, true); });

  playBtn.addEventListener("click", function () {
    disarm();
    if (a.paused) a.play().catch(function () {}); else a.pause();
  });

  var first = a.play();
  if (first && first.catch) first.then(disarm).catch(function () { hint.hidden = false; });
})();
</script>
